overlay: 1.0.0
info:
  title: Commerce -- schemaorg-30.1 alignment
  version: 0.1.0-draft.20261111
  description: Marks the common Commerce OpenAPI with the schemaorg-30.1 object each schema corresponds to, and the field
    each property maps to. Generated by scripts/overlay.py from standards/schemaorg-30.1.yml; nothing is renamed.
extends: openapi.yml
actions:
- target: $.components.schemas.Order
  update:
    x-commons-standard:
      standard: schemaorg-30.1
      source: https://github.com/schemaorg/schemaorg/tree/v30.1
      objects:
      - Order
      core_coverage: 0.333
      fields:
        billing_address: billingAddress
        customer_id: customer
        discount_total: discount
        placed_at: orderDate
        number: orderNumber
        status: orderStatus
        payment_method: paymentMethod
      standard_only:
      - acceptedOffer
      - broker
      - confirmationNumber
      - discountCode
      - discountCurrency
      - isGift
      - orderDelivery
      - orderedItem
      - partOfInvoice
      - paymentDueDate
      - paymentMethodId
      - paymentUrl
      - seller
- target: $.components.schemas.Product
  update:
    x-commons-standard:
      standard: schemaorg-30.1
      source: https://github.com/schemaorg/schemaorg/tree/v30.1
      objects:
      - Product
      core_coverage: 0.75
      fields:
        brand: brand
        category_ids: category
        barcode: gtin
        height: height
        sku: mpn
        size: size
        weight: weight
        width: width
        description: description
        images: image
        name: name
        slug: url
      standard_only:
      - additionalProperty
      - aggregateRating
      - asin
      - audience
      - authorizedRepresentative
      - award
      - color
      - colorSwatch
      - consumerNotice
      - countryOfAssembly
      - countryOfLastProcessing
      - countryOfOrigin
      - depth
      - displayLocation
      - funding
      - gtin12
      - gtin13
      - gtin14
      - gtin8
      - hasAdultConsideration
      - hasCertification
      - hasDigitalProductPassport
      - hasEnergyConsumptionDetails
      - hasGS1DigitalLink
      - hasMeasurement
      - hasMerchantReturnPolicy
      - importer
      - inProductGroupWithID
      - isAccessoryOrSparePartFor
      - isConsumableFor
      - isFamilyFriendly
      - isOftenBoughtWith
      - isRelatedTo
      - isSimilarTo
      - isVariantOf
      - itemCondition
      - keywords
      - logo
      - material
      - mobileUrl
      - model
      - negativeNotes
      - nsn
      - offers
      - pattern
      - positiveNotes
      - productID
      - productionDate
      - purchaseDate
      - recycledContentPercentage
      - releaseDate
      - review
      - slogan
      - specification
      - substanceOfConcern
      - additionalType
      - alternateName
      - disambiguatingDescription
      - identifier
      - mainEntityOfPage
      - owner
      - potentialAction
      - sameAs
      - subjectOf
